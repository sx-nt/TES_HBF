
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity's Best Friend</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <main id="game">

    <!-- PRIMEIRA TELA -->
    <section id="start-screen" class="screen">

    <div class="start-version">VERSION 0.01</div>

    <div class="start-content">
        <h1>HUMANITY'S BEST FRIEND</h1>

        <button id="start-button" type="button" onclick="window.startBoot?.()">START</button>
    </div>

    <div class="start-copyright">©2026 SXNT</div>

</section>

    <!-- BOOT -->
    <section id="boot-screen" class="screen hidden">
        <div class="terminal">
            <p class="terminal-title">MEE SYSTEM // BIOS v.03.06</p>
            <div id="boot-log"></div>
            <p id="boot-prompt"></p>

            <div id="year-counter" class="hidden">
                <p id="year-text">TIME ELAPSED: 0 YEARS</p>
                <div class="progress-bar">
                    <div id="progress"></div>
                </div>
            </div>
        </div>
        <p id="dialogue-skip-hint">PRESSIONE ESPAÇO PARA PULAR</p>
    </section>

    <!-- CENÁRIO -->
    <div id="scene" class="hidden">
        <img id="background" src="" alt="Cenário">
        <div id="hotspots"></div>
    </div>

    <div id="top-hud" class="hidden" aria-label="Controles do jogo">
        <button id="inventory-toggle" type="button" aria-expanded="false">Inventário</button>
        <button id="pause-button" type="button" aria-expanded="false">Pausar</button>
        <div id="battery-meter" role="status" aria-label="Bateria do MEE">
            <span>BATERIA</span>
            <div class="battery-track"><div id="battery-level"></div></div>
            <strong id="battery-value">100%</strong>
        </div>
    </div>

    <aside id="inventory" class="hidden" aria-live="polite" aria-label="Inventário">
        <span>INVENTÁRIO</span>
        <div id="inventory-items">Vazio</div>
    </aside>

    <aside id="pause-menu" class="hidden" aria-label="Menu de pausa">
        <h2>JOGO PAUSADO</h2>
        <button id="resume-button" type="button">Continuar</button>
        <button id="pause-restart-button" type="button">Reiniciar</button>
    </aside>

    <div id="officer-overlay" class="hidden" aria-hidden="true">
        <img src="assets/overlay/officer_overlay.png" alt="Officer Gates" />
    </div>

    <div id="interface" class="hidden">
        <button id="blindfold-button">
            Retirar venda
        </button>
        <div id="scene-actions"></div>
    </div>

    <section id="dialogue" class="hidden">
    <p id="dialogue-speaker" class="hidden"></p>
    <p id="dialogue-skip-hint">PRESSIONE ESPAÇO PARA PULAR</p>
    <p id="dialogue-text"></p>
    <div id="dialogue-choices"></div>
    <button id="dialogue-next">Continuar</button>
    </section>

    <section id="game-over" class="screen hidden">
        <h1>YOU HAVE BEEN DISCOVERED</h1>
        <p>MEE teve sua verdadeira identidade revelada.</p>
        <button id="restart-button">RESTART</button>
    </section>

    <div id="crt-overlay"></div>
    <div id="crt-transition"></div>

    </main>

    <script type="module" src="core/game-services.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
